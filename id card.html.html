<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            width: 320px;
            padding: 25px;
            background: white;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);

            /* Fade-in animation */
            animation: fadeIn 1.5s ease-in;
            
            /* Smooth scale transition */
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h2 {
            color: #333;
        }

        .card p {
            color: #555;
            margin: 10px;
        }

        .contact-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        .contact-btn:hover {
            background: #0056b3;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>John Doe</h2>

        <p><strong>Course:</strong> MCA</p>
        <p><strong>College:</strong> Alliance University</p>
        <p><strong>Email:</strong> johndoe@gmail.com</p>

        <button class="contact-btn">Contact</button>
    </div>

</body>
</html>
