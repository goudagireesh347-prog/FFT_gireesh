<!DOCTYPE html>
<html>
<head>
    <title>Age Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;

            /* Button rotation/transform transition */
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        button:hover {
            transform: rotate(5deg) scale(1.1);
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Bounce animation */
        .bounce {
            animation: bounce 0.6s;
        }

        @keyframes bounce {
            0%   { transform: translateY(0); }
            30%  { transform: translateY(-20px); }
            50%  { transform: translateY(0); }
            70%  { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Age Checker</h2>

        <input type="text" id="name" placeholder="Enter your name">

        <input type="number" id="age" placeholder="Enter your age">

        <br>

        <button onclick="checkAge()">Check Age</button>

        <div id="result"></div>
    </div>

    <script>
        function checkAge() {
            let name = document.getElementById("name").value;
            let age = Number(document.getElementById("age").value);
            let result = document.getElementById("result");

            if (name === "" || age === "") {
                result.innerHTML = "Please enter name and age.";
            }
            else if (age >= 18) {
                result.innerHTML = "Hello " + name + ", you are eligible (18 or above).";
            }
            else {
                result.innerHTML = "Sorry " + name + ", you are below 18.";
            }

            // Apply bounce animation
            result.classList.remove("bounce");
            void result.offsetWidth;
            result.classList.add("bounce");
        }
    </script>

</body>
</html>
